<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Report Incident
    </title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="form-container">

        <a href="index.html">
            ← Back Home
        </a>

        <h1>
            Report Security Incident
        </h1>

        <form id="incidentForm">

            <!-- INCIDENT TITLE -->

            <input
                type="text"
                id="title"
                placeholder="Incident Title"
                required
            >

            <!-- LOCATION -->

            <input
                type="text"
                id="location"
                placeholder="Location"
                required
            >

            <!-- CATEGORY -->

            <label for="category">
                Incident Category
            </label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Theft">
                    Theft
                </option>

                <option value="Trespassing">
                    Trespassing
                </option>

                <option value="Vandalism">
                    Vandalism
                </option>

                <option value="Assault">
                    Assault
                </option>

                <option value="Fire">
                    Fire
                </option>

                <option value="Accident">
                    Accident
                </option>

                <option value="Unauthorized Access">
                    Unauthorized Access
                </option>

                <option value="Suspicious Activity">
                    Suspicious Activity
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <!-- SEVERITY -->

            <label for="severity">
                Severity
            </label>

            <select
                id="severity"
                required
            >

                <option value="">
                    Select Severity
                </option>

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

                <option value="Critical">
                    Critical
                </option>

            </select>

            <!-- DESCRIPTION -->

            <textarea
                id="description"
                placeholder="Describe the incident"
                required
            ></textarea>

            <button type="submit">
                Submit Report
            </button>

        </form>

        <p id="message"></p>

    </div>

    <footer class="footer">

        <p>
            © 2026 Security Incident Reporting App |
            Developed by Attah Collins +2348037728338
        </p>

    </footer>

    <script src="js/app.js"></script>

</body>

</html>
